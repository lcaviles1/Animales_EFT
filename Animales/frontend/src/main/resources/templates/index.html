<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unidos por los Animales</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="header">
    <div>
        <h1>Unidos por los Animales</h1>
        <p>Catálogo público de mascotas disponibles para adopción</p>
    </div>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/login}">Login</a>
    </nav>
</header>

<section class="filtros">
    <h2>Buscar mascotas</h2>
    <form th:action="@{/}" method="get" class="form-grid">
        <input type="text" name="especie" placeholder="Especie" th:value="${especie}">
        <input type="number" name="edad" placeholder="Edad" th:value="${edad}">
        <input type="text" name="ubicacion" placeholder="Ubicación" th:value="${ubicacion}">
        <input type="text" name="genero" placeholder="Género" th:value="${genero}">
        <button type="submit">Buscar</button>
    </form>
</section>

<section class="catalogo">
    <div class="card" th:each="mascota : ${mascotas}">
        <img th:src="${mascota.fotoUrl}" alt="Foto mascota">
        <h3 th:text="${mascota.nombre}">Nombre</h3>
        <p><strong>Especie:</strong> <span th:text="${mascota.especie}"></span></p>
        <p><strong>Raza:</strong> <span th:text="${mascota.raza}"></span></p>
        <p><strong>Edad:</strong> <span th:text="${mascota.edad}"></span></p>
        <p><strong>Ubicación:</strong> <span th:text="${mascota.ubicacion}"></span></p>
        <p><strong>Género:</strong> <span th:text="${mascota.genero}"></span></p>
        <p><strong>Estado:</strong> <span th:text="${mascota.estadoAdopcion}"></span></p>
    </div>
</section>
</body>
</html>
